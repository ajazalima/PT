<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTMS - Complain Sheet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background: #f3f5fb; color: #20243a; font-family: Arial, sans-serif; }
    .brand { color: #5145cd; font-weight: 800; }
    .card { border: 0; border-radius: 16px; box-shadow: 0 5px 24px rgba(0,0,0,.06); }
    .btn-primary { background: #5145cd; border-color: #5145cd; }
    .btn-primary:hover { background: #4035ae; border-color: #4035ae; }
    .form-control { padding: 11px; border-radius: 10px; }
    .topbar { background: #fff; border-radius: 14px; padding: 14px 18px; box-shadow: 0 3px 15px rgba(0,0,0,.04); }
    .hidden { display: none !important; }
    #message { white-space: pre-wrap; }

    /* Grid-only layout: every customer has an individual card. */
    #recordsContainer.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 16px;
    }

    .customer-card {
      min-width: 0;
      background: #fff;
      border: 1px solid #ececf5;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(30, 35, 80, .045);
      display: flex;
      flex-direction: column;
    }

    .customer-name-block {
      min-width: 0;
      padding-bottom: 13px;
      margin-bottom: 14px;
      border-bottom: 1px solid #eeeef6;
    }

    .customer-label, .detail-label {
      display: block;
      color: #85879a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .customer-name {
      display: block;
      color: #292d46;
      font-size: 17px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .customer-details {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
      flex: 1;
    }

    .detail-value {
      color: #34384f;
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 14px;
    }

    .detail-value.amount-value { color: #16834b; font-weight: 800; white-space: nowrap; }
    .detail-value.date-value { white-space: normal; }

    .complain-sheet-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 17px;
      padding: 10px 14px;
      border: 1px solid #5145cd;
      border-radius: 10px;
      background: #5145cd;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }

    .complain-sheet-button:hover { background: #4035ae; border-color: #4035ae; }
    .complain-sheet-button:focus-visible { outline: 3px solid rgba(81,69,205,.25); outline-offset: 2px; }
    .complain-sheet-button svg { width: 17px; height: 17px; flex: 0 0 auto; }

    @media (max-width: 576px) {
      .topbar { padding: 12px; }
      .topbar h5 { font-size: 16px; }
      .card-body-mobile { padding: 14px !important; }
      .customer-card { padding: 15px; }
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="topbar d-flex justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h5 class="brand mb-1">PTMS</h5>
        <small class="text-secondary">Parcel Tracking Management System — Complain Sheet</small>
      </div>
      <div class="text-end">
        <div id="connectionStatus" class="small text-secondary">Checking connection...</div>
        <small id="accountLabel" class="text-secondary"></small>
      </div>
    </div>

    <div id="message" class="alert hidden" role="alert"></div>
    <div id="loadingAuth" class="text-center text-secondary py-4">Checking login...</div>

    <section id="loginSection" class="row justify-content-center hidden">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card p-4 p-md-5">
          <h4 class="text-center mb-4">Sign In to PTMS</h4>
          <form id="loginForm">
            <label for="email" class="form-label">Email Address</label>
            <input id="email" type="email" class="form-control mb-3" autocomplete="username" required>
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
            <button id="loginButton" type="submit" class="btn btn-primary w-100">Sign In</button>
          </form>
          <small class="text-secondary mt-3">Use the same PTMS account used in the main parcel app.</small>
        </div>
      </div>
    </section>

    <section id="viewerSection" class="hidden">
      <div class="card p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
          <div>
            <h5 class="mb-1">Parcel List</h5>
            <small class="text-secondary"><span id="parcelCount">0</span> customers</small>
          </div>

          <div class="d-flex flex-wrap align-items-center gap-2">
            <button id="refreshButton" type="button" class="btn btn-outline-primary btn-sm">Refresh</button>
            <button id="logoutButton" type="button" class="btn btn-outline-danger btn-sm">Logout</button>
          </div>
        </div>

        <div id="loadingData" class="text-center text-secondary py-4">Loading parcels from Realtime Database...</div>
        <div id="emptyState" class="alert alert-light text-center hidden">No parcel records found in this account.</div>
        <div id="recordsContainer" class="grid-view hidden" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <!-- Same Firebase project and SDK as the main PTMS app -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // Same Firebase client configuration used by your main PTMS app.
    const firebaseConfig = {
      apiKey: "AIzaSyDnK3cu3mPIdWErwdBgpgWkh-5cgxLWlAs",
      authDomain: "parcel-tracking-bdc29.firebaseapp.com",
      databaseURL: "https://parcel-tracking-bdc29-default-rtdb.firebaseio.com",
      projectId: "parcel-tracking-bdc29",
      storageBucket: "parcel-tracking-bdc29.firebasestorage.app",
      messagingSenderId: "549068529289",
      appId: "1:549068529289:web:c5f85a4e5834a85bfa3058",
      measurementId: "G-MNPKPKNC6C"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const $ = (id) => document.getElementById(id);
    let activeParcelRef = null;
    let currentUser = null;
    let currentParcels = [];

    function showMessage(text, type = "danger") {
      $("message").textContent = text;
      $("message").className = `alert alert-${type}`;
    }

    function hideMessage() {
      $("message").classList.add("hidden");
    }

    function authErrorText(error) {
      const messages = {
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Incorrect email or password.",
        "auth/too-many-requests": "Too many attempts. Please try again later.",
        "auth/network-request-failed": "Network error. Check your internet connection."
      };
      return messages[error.code] || error.message || "Unable to sign in.";
    }

    function parseMoney(value) {
      if (value === null || value === undefined || value === "") return null;
      const raw = String(value).replace(/,/g, "").replace(/[^0-9.\-]/g, "");
      if (!raw || raw === "." || raw === "-") return null;
      const number = Number(raw);
      return Number.isFinite(number) ? number : null;
    }

    // Match the main PTMS app: show the saved net amount after its recorded deduction.
    function getDisplayedAmount(parcel) {
      const gross = parseMoney(parcel.amount);
      if (gross === null) return parcel.amount ? String(parcel.amount) : "—";

      if (parcel.netAmount !== null && parcel.netAmount !== undefined && parcel.netAmount !== "") {
        const net = parseMoney(parcel.netAmount);
        return net === null ? String(parcel.netAmount) : formatRupees(net);
      }

      if (parcel.deductionApplied !== null && parcel.deductionApplied !== undefined && parcel.deductionApplied !== "") {
        const deduction = Math.max(0, Number(parcel.deductionApplied) || 0);
        return formatRupees(Math.max(0, gross - deduction));
      }

      // Older records without deduction fields are shown as originally entered.
      return formatRupees(gross);
    }

    function formatRupees(value) {
      return "Rs. " + Number(value).toLocaleString("en-PK", {
        maximumFractionDigits: 2,
        minimumFractionDigits: 0
      });
    }

    function formatBookingDate(timestamp) {
      const value = Number(timestamp);
      if (!Number.isFinite(value) || value <= 0) return "—";
      return new Date(value).toLocaleDateString("en-GB", {
        day: "2-digit", month: "2-digit", year: "numeric"
      });
    }

    function addDetail(parent, label, value, extraClass = "") {
      const wrapper = document.createElement("div");
      wrapper.className = `customer-detail ${extraClass}`.trim();

      const heading = document.createElement("span");
      heading.className = "detail-label";
      heading.textContent = label;

      const content = document.createElement("p");
      content.className = "detail-value";
      content.textContent = value;
      if (label === "Amount") content.classList.add("amount-value");
      if (label === "Booking Date") content.classList.add("date-value");

      wrapper.append(heading, content);
      parent.appendChild(wrapper);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }

    function getTrackingId(parcel) {
      const candidateKeys = [
        "trackingId", "trackingID", "trackingNumber", "trackingNo", "trackingCode",
        "tracking_id", "tracking_no", "tracking_code", "tracking",
        "vppNumber", "vppNo", "vpp", "articleNumber", "articleNo",
        "consignmentNumber", "consignmentNo", "barcode", "itemCode"
      ];

      for (const key of candidateKeys) {
        const value = parcel && parcel[key];
        if (value !== null && value !== undefined && String(value).trim() !== "") {
          if (typeof value === "object") {
            const nested = value.id || value.number || value.code || value.trackingId;
            if (nested !== null && nested !== undefined && String(nested).trim() !== "") return String(nested);
          } else {
            return String(value).trim();
          }
        }
      }

      // Also support differently-cased tracking/VPP field names in older records.
      for (const [key, value] of Object.entries(parcel || {})) {
        if (/(tracking|vpp|consignment|article).*(id|no|number|code)?/i.test(key) &&
            value !== null && value !== undefined && typeof value !== "object" && String(value).trim() !== "") {
          return String(value).trim();
        }
      }
      return "—";
    }

    function formatAddressTwoLines(value) {
      const text = String(value ?? "").trim();
      if (!text || text === "—") return text;

      // Prefer splitting after the first comma; otherwise split the words near the middle.
      const commaIndex = text.indexOf(",");
      if (commaIndex > 0 && commaIndex < text.length - 1) {
        return text.slice(0, commaIndex).trim() + "\n" +
               text.slice(commaIndex + 1).trim();
      }

      const words = text.split(/\s+/);
      if (words.length < 2) return text;
      const middle = Math.ceil(words.length / 2);
      return words.slice(0, middle).join(" ") + "\n" +
             words.slice(middle).join(" ");
    }

    function printComplainSheet(parcel) {
      const customerName = parcel.customerName ? String(parcel.customerName) : "—";
      const address = parcel.address ? String(parcel.address) : "—";
      const addressFirst = formatAddressTwoLines(address);
      const amount = getDisplayedAmount(parcel);
      const bookingDate = formatBookingDate(parcel.createdAt);
      const trackingId = getTrackingId(parcel);
      const backgroundImageUrl = new URL("ComplainSheet.png", window.location.href).href;

      // Open the print window directly from the button click to avoid popup blockers.
      const printWindow = window.open("", "_blank", "width=900,height=1200");
      if (!printWindow) {
        showMessage("Printing window was blocked. Please allow pop-ups for this site and try again.", "warning");
        return;
      }

      const printHtml = `<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complain Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 210mm; height: 297mm; margin: 0; padding: 0; }
    body { font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif; color: #000; }
    @page { size: A4 portrait; margin: 0; }

    /*
      Per-field movement controls (edit these values):
      -left moves an item left; -right moves it right;
      -up moves it up; -down moves it down.
      Example: --name-left: 10px; moves the customer name 10px left.
      Address copy #1 and #2 can be moved independently.
    */
    :root {
      --name-left: 246px; --name-right: 0px; --name-up: 0px; --name-down: 70px;
      --tracking-left: 0px; --tracking-right: 40px; --tracking-up: 84px; --tracking-down: 0px;
      --date-left: 34px; --date-right: 0px; --date-up: 90px; --date-down: 0px;
      --amount-left: 0px; --amount-right: 22px; --amount-up: 92px; --amount-down: 0px;
      --address-two-left: 330px; --address-two-right: 0px; --address-two-up: 485px; --address-two-down: 0px;

      /* Font sizes: adjust values in pt or px. */
      --name-font-size: 12pt;
      --tracking-font-size: 14pt;
      --date-font-size: 12pt;
      --address-one-font-size: 0pt;
      --amount-font-size: 14pt;
      --address-two-font-size: 08pt;
      /* Visibility controls */
      --address-one-display: none;
    }

    .print-page {
      position: relative;
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ComplainSheet.png is already portrait: print it straight, without rotation. */
    .complain-sheet-background {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: block;
      width: 210mm;
      height: 297mm;
      object-fit: fill;
      transform: none;
    }

    /*
      All data is positioned independently on the upright portrait sheet.
      Adjust each field's top/left/right values here to line it up with the form.
    */
    .customer-print-details {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 210mm;
      height: 297mm;
      margin: 0;
      padding: 0;
      color: #000;
      background: transparent;
      border: 0;
      transform: none;
      direction: rtl;
    }

    .field {
      position: absolute;
      margin: 0;
      padding: 0;
      color: #000000;
      background: transparent;
      border: 0;
      font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
      font-size: 10.5pt;
      font-weight: 600;
      line-height: 1.7;
      direction: rtl;
      text-align: right;
      unicode-bidi: plaintext;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* Customer Name — move with --name-left/right/up/down. */
    .name-value {
      top: calc(22% + var(--name-down) - var(--name-up));
      left: calc(55% + var(--name-right) - var(--name-left));
      width: 31%;
      font-size: var(--name-font-size);
    }

    /* Tracking ID — move independently with --tracking-left/right/up/down. */
    .tracking-value {
      top: calc(28.7% + var(--tracking-down) - var(--tracking-up));
      left: calc(8% + var(--tracking-right) - var(--tracking-left));
      width: 38%;
      direction: ltr;
      text-align: left;
      unicode-bidi: plaintext;
      font-family: Arial, sans-serif;
      font-size: var(--tracking-font-size);
    }

    /* Booking Date — move with --date-left/right/up/down. */
    .date-value {
      top: calc(36.6% + var(--date-down) - var(--date-up));
      left: calc(68% + var(--date-right) - var(--date-left));
      width: 19%;
      direction: ltr;
      text-align: right;
      font-family: Arial, sans-serif;
      font-size: var(--date-font-size);
    }

    /* Address copy #1 — independent movement controls. */
    .address-one-value {
      top: calc(36.6% + var(--address-one-down) - var(--address-one-up));
      left: calc(32% + var(--address-one-right) - var(--address-one-left));
      width: 28%;
      font-size: var(--address-one-font-size);
      white-space: pre-line;
      line-height: 1.45;
    }

    /* Total Amount — move with --amount-left/right/up/down. */
    .amount-value {
      top: calc(36.6% + var(--amount-down) - var(--amount-up));
      left: calc(8% + var(--amount-right) - var(--amount-left));
      width: 20%;
      direction: ltr;
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: var(--amount-font-size);
    }

    /* Address copy #2 — independent movement controls. */
    .address-two-value {
      top: calc(57.4% + var(--address-two-down) - var(--address-two-up));
      left: calc(8% + var(--address-two-right) - var(--address-two-left));
      width: 84%;
      font-size: var(--address-two-font-size);
    }

    @media screen {
      body { background: #e8e8ed; }
      .print-page { margin: 12px auto; box-shadow: 0 2px 18px rgba(0,0,0,.18); }
    }
    @media print {
      html, body { width: 210mm; height: 297mm; }
      .print-page { margin: 0; }
    }
  </style>
</head>
<body>
  <main class="print-page">
    <img id="complainSheetBackground" class="complain-sheet-background" src="${escapeHtml(backgroundImageUrl)}" alt="Complain Sheet background">
    <section class="customer-print-details">
      <div class="field name-value">${escapeHtml(customerName)}</div>
      <div class="field tracking-value">${escapeHtml(trackingId)}</div>
      <div class="field date-value">${escapeHtml(bookingDate)}</div>
      <div class="field address-one-value">${escapeHtml(addressFirst)}</div>
      <div class="field amount-value">${escapeHtml(amount)}</div>
      <div class="field address-two-value">${escapeHtml(address)}</div>
    </section>
  </main>
  <script>
    window.addEventListener("load", function () {
      const background = document.getElementById("complainSheetBackground");
      if (!background || !background.complete || background.naturalWidth === 0) {
        alert("ComplainSheet.png was not found. Keep ComplainSheet.png in the same folder as this PTMS HTML file.");
        return;
      }
      const readyForUrduFont = document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve();
      readyForUrduFont.then(function () {
        window.focus();
        setTimeout(function () { window.print(); }, 250);
      });
    });
  <\/script>
</body>
</html>`;

      printWindow.document.open();
      printWindow.document.write(printHtml);
      printWindow.document.close();
      hideMessage();
    }

    function createCustomerCard(parcel) {
      const card = document.createElement("article");
      card.className = "customer-card";

      const nameBlock = document.createElement("div");
      nameBlock.className = "customer-name-block";

      const nameLabel = document.createElement("span");
      nameLabel.className = "customer-label";
      nameLabel.textContent = "Customer";

      const name = document.createElement("strong");
      name.className = "customer-name";
      name.dir = "auto";
      name.textContent = parcel.customerName || "—";
      nameBlock.append(nameLabel, name);

      const details = document.createElement("div");
      details.className = "customer-details";
      addDetail(details, "Address", parcel.address ? String(parcel.address) : "—", "address-detail");
      addDetail(details, "Amount", getDisplayedAmount(parcel));
      addDetail(details, "Booking Date", formatBookingDate(parcel.createdAt));
      addDetail(details, "Tracking ID", getTrackingId(parcel));

      const complainSheetButton = document.createElement("button");
      complainSheetButton.type = "button";
      complainSheetButton.className = "complain-sheet-button";
      complainSheetButton.title = "Print Complain Sheet for " + (parcel.customerName || "this customer");
      complainSheetButton.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path>
          <path d="M14 3v5h5M8 12h8M8 16h5"></path>
          <path d="M8 8h2"></path>
        </svg>
        <span>Complain Sheet</span>`;
      complainSheetButton.addEventListener("click", () => printComplainSheet(parcel));

      card.append(nameBlock, details, complainSheetButton);
      return card;
    }

    function renderParcels() {
      const container = $("recordsContainer");
      container.replaceChildren();
      container.classList.add("grid-view");

      const fragment = document.createDocumentFragment();
      currentParcels.forEach((parcel) => fragment.appendChild(createCustomerCard(parcel)));
      container.appendChild(fragment);

      $("parcelCount").textContent = String(currentParcels.length);
      $("loadingData").classList.add("hidden");
      $("emptyState").classList.toggle("hidden", currentParcels.length !== 0);
      container.classList.toggle("hidden", currentParcels.length === 0);
    }

    function clearParcelListener() {
      if (activeParcelRef) {
        activeParcelRef.off("value");
        activeParcelRef = null;
      }
    }

    function loadParcels(uid) {
      clearParcelListener();
      $("loadingData").classList.remove("hidden");
      $("emptyState").classList.add("hidden");
      $("recordsContainer").classList.add("hidden");
      $("recordsContainer").replaceChildren();
      currentParcels = [];

      // Main app stores each user's parcels at: users/{uid}/parcels
      activeParcelRef = db.ref(`users/${uid}/parcels`);
      activeParcelRef.on("value", (snapshot) => {
        if (!currentUser || currentUser.uid !== uid) return;

        const records = snapshot.val() || {};
        currentParcels = Object.entries(records).map(([id, parcel]) => ({
          id,
          ...(parcel || {})
        }));

        // Newest booking date first.
        currentParcels.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
        renderParcels();
        $("connectionStatus").textContent = "Realtime Database connected";
      }, (error) => {
        $("loadingData").classList.add("hidden");
        $("connectionStatus").textContent = "Database error";
        showMessage(
          error.code === "PERMISSION_DENIED"
            ? "Database permission denied. Sign in with the PTMS account that owns these parcels and check your Realtime Database rules."
            : (error.message || "Could not load parcel data."),
          "danger"
        );
      });
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage();
      $("loginButton").disabled = true;
      $("loginButton").textContent = "Signing in...";
      try {
        await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
      } catch (error) {
        showMessage(authErrorText(error));
      } finally {
        $("loginButton").disabled = false;
        $("loginButton").textContent = "Sign In";
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      clearParcelListener();
      await auth.signOut();
    });

    $("refreshButton").addEventListener("click", () => {
      if (currentUser) loadParcels(currentUser.uid);
    });


    auth.onAuthStateChanged((user) => {
      currentUser = user;
      $("loadingAuth").classList.add("hidden");
      hideMessage();

      if (!user) {
        clearParcelListener();
        currentParcels = [];
        $("viewerSection").classList.add("hidden");
        $("loginSection").classList.remove("hidden");
        $("accountLabel").textContent = "";
        $("connectionStatus").textContent = navigator.onLine ? "Ready to sign in" : "Offline";
        return;
      }

      $("loginSection").classList.add("hidden");
      $("viewerSection").classList.remove("hidden");
      $("accountLabel").textContent = user.email || "Signed in";
      loadParcels(user.uid);
    });

    window.addEventListener("online", () => {
      $("connectionStatus").textContent = "Online";
      if (currentUser) loadParcels(currentUser.uid);
    });
    window.addEventListener("offline", () => {
      $("connectionStatus").textContent = "Offline — waiting for connection";
    });

  </script>
</body>
</html>
